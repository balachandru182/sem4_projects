<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
</head>
<body>
    <h2>Create Account</h2>

    <nav>
        <a href="one.html">Home</a>
<a href="two.html">Login</a>
<a href="three.html">Register</a>
<a href="four.html">Dashboard</a>

<form action="two.html">
    </nav>

    <form action="login.html">
        <p>
            <label for="full-name">Full Name:</label>
            <input id="full-name" name="fullName" type="text"
                   placeholder="Full Name" required>
        </p>

        <p>
            <label for="email">Email:</label>
            <input id="email" name="email" type="email"
                   placeholder="Email" required>
        </p>

        <p>
            <label for="username">Username:</label>
            <input id="username" name="username" type="text"
                   placeholder="Username" required>
        </p>

        <p>
            <label for="password">Password:</label>
            <input id="password" name="password" type="password"
                   placeholder="Password" required>
        </p>

        <p>
            <label for="confirm-password">Confirm Password:</label>
            <input id="confirm-password" name="confirmPassword"
                   type="password" placeholder="Confirm Password" required>
        </p>

        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="login.html">Login</a></p>
    <p><a href="index.html">Back to Home</a></p>
</body>
</html>
